name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Java/Kotlin (hosts/intellij) prerequisites -----------------------
      # The IntelliJ plugin's Gradle build has a hard dependency on the shared
      # React webview bundle existing before Gradle runs (see syncWebview task
      # in hosts/intellij/build.gradle.kts), plus JDK 17. Autobuild can't know
      # this, so we build it manually.
      - name: Set up Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: vscode-acp/webview-ui/package-lock.json

      - name: Build shared webview bundle (required by Gradle syncWebview task)
        if: matrix.language == 'java-kotlin'
        working-directory: vscode-acp/webview-ui
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # --- Manual build step for java-kotlin only -----------------------
      - name: Build IntelliJ plugin (Kotlin/Java)
        if: matrix.language == 'java-kotlin'
        working-directory: hosts/intellij
        run: |
          chmod +x ./gradlew
          ./gradlew compileKotlin compileTestKotlin compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
